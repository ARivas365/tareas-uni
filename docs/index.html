<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mis tareas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232f6fde'/><path d='M18 33l9 9 19-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1c1b19; --muted: #6b6760; --line: #e4e0d8;
    --late: #c92a2a; --late-bg: #fdecec; --today: #d9480f; --today-bg: #fff1e6;
    --soon: #9a6700; --ok: #2b8a3e; --chip: #ebe7e0; --chip-on: #1c1b19; --chip-on-ink: #fff;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514; --card: #211f1d; --ink: #f1eee9; --muted: #a09b93; --line: #34312d;
      --late: #ff8787; --late-bg: #3a1f1f; --today: #ffa94d; --today-bg: #3a2a1a;
      --soon: #f0c14b; --ok: #69db7c; --chip: #2c2a27; --chip-on: #f1eee9; --chip-on-ink: #161514;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }
  header { padding: 18px 2px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .btn-icon {
    border: 0; background: var(--chip); color: var(--ink); width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .btn-icon svg { width: 20px; height: 20px; }
  .btn-icon.girando svg { animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 12px; }
  .dato { background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
  .dato b { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .dato span { font-size: 12px; color: var(--muted); }
  .dato.late b { color: var(--late); }
  .dato.today b { color: var(--today); }

  .filtros { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .chip {
    border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 8px 13px;
    font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
  .punto { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .aviso {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 13px;
    background: var(--today-bg); color: var(--ink); border-left: 4px solid var(--today);
  }
  .aviso b { color: var(--today); }

  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 22px 2px 8px; display: flex; justify-content: space-between;
  }
  h2.late { color: var(--late); }
  .lista { display: grid; gap: 8px; }
  .tarea {
    background: var(--card); border-radius: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    display: grid; grid-template-columns: 44px 1fr; align-items: start;
  }
  .tarea.late { background: linear-gradient(90deg, var(--late-bg), var(--card) 70%); }
  .check {
    margin: 12px 0 0 10px; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line);
    background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: #fff;
  }
  .check svg { width: 16px; height: 16px; opacity: 0; }
  .tarea.hecha .check { background: var(--ok); border-color: var(--ok); }
  .tarea.hecha .check svg { opacity: 1; }
  .tarea.hecha .titulo { text-decoration: line-through; color: var(--muted); }
  .cuerpo { padding: 11px 12px 11px 4px; min-width: 0; cursor: pointer; }
  .fila { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
  .titulo { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .cuando { font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cuando.late { color: var(--late); } .cuando.today { color: var(--today); } .cuando.soon { color: var(--soon); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .meta .punto { display: inline-block; margin-right: 6px; vertical-align: 1px; background: var(--uni); }
  .detalle { display: none; margin-top: 8px; font-size: 13.5px; white-space: pre-line; }
  .tarea.abierta .detalle { display: block; }
  .detalle a {
    display: inline-block; margin-top: 8px; color: var(--chip-on-ink); background: var(--chip-on);
    padding: 7px 12px; border-radius: 10px; text-decoration: none; font-weight: 600;
  }
  .fecha-larga { color: var(--muted); }

  .vacio { text-align: center; color: var(--muted); padding: 40px 10px; }
  .vacio b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
  .pie { margin-top: 26px; display: flex; justify-content: center; }
  .pie .chip { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mis tareas</h1>
      <div class="sub" id="actualizado">Cargando…</div>
    </div>
    <button class="btn-icon" id="recargar" aria-label="Recargar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <div class="resumen" id="resumen"></div>
  <div class="filtros" id="filtros" role="group" aria-label="Filtrar por universidad"></div>
  <div id="avisos"></div>
  <main id="contenido"></main>
  <div class="pie"><button class="chip" id="verHechas" aria-pressed="false"></button></div>
</div>

<script>
(() => {
  const CLAVE_HECHAS = "tareas-hechas";
  const CLAVE_FILTRO = "tareas-filtro";
  const DIA = 86400000;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let datos = null;
  let hechas = leer(CLAVE_HECHAS, {});
  let filtro = leer(CLAVE_FILTRO, "todas");
  let verHechas = false;
  const abiertas = new Set();

  function leer(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

  // Fecha límite como Date. Las tareas "todo el día" vencen al final de ese día (hora local).
  function fechaDe(t) {
    if (t.todo_el_dia) { const [a, m, d] = t.vence.split("-").map(Number); return new Date(a, m - 1, d, 23, 59, 59); }
    return new Date(t.vence);
  }
  const inicioDia = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const difDias = (d, hoy) => Math.round((inicioDia(d) - inicioDia(hoy)) / DIA);
  const hora = (d) => d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
  const diaCorto = (d) => d.toLocaleDateString("es", { weekday: "short", day: "numeric", month: "short" }).replace(/\./g, "");

  function etiquetaCuando(t, d, ahora) {
    const n = difDias(d, ahora);
    const h = t.todo_el_dia ? "" : " " + hora(d);
    if (d < ahora) {
      const horas = Math.round((ahora - d) / 3600000);
      return { txt: horas < 24 ? `hace ${Math.max(1, horas)} h` : `hace ${-n} d`, cls: "late" };
    }
    if (n === 0) {
      const horas = (d - ahora) / 3600000;
      return { txt: horas < 6 ? `en ${horas < 1 ? Math.max(1, Math.round(horas * 60)) + " min" : Math.round(horas) + " h"}` : "hoy" + h, cls: "today" };
    }
    if (n === 1) return { txt: "mañana" + h, cls: "today" };
    if (n <= 7) return { txt: diaCorto(d).split(" ")[0] + h, cls: "soon" };
    return { txt: diaCorto(d), cls: "" };
  }

  function grupoDe(d, ahora) {
    if (d < ahora) return ["late", "Vencidas"];
    const n = difDias(d, ahora);
    if (n === 0) return ["hoy", "Hoy"];
    if (n === 1) return ["manana", "Mañana"];
    if (n <= 7) return ["semana", "Próximos 7 días"];
    if (n <= 30) return ["mes", "Este mes"];
    return ["despues", "Más adelante"];
  }

  function haceCuanto(iso) {
    const min = Math.round((Date.now() - new Date(iso)) / 60000);
    if (min < 1) return "recién";
    if (min < 60) return `hace ${min} min`;
    const h = Math.round(min / 60);
    if (h < 48) return `hace ${h} h`;
    return `hace ${Math.round(h / 24)} días`;
  }

  async function cargar() {
    const btn = $("#recargar");
    btn.classList.add("girando");
    try {
      const r = await fetch("tareas.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      datos = await r.json();
      // Olvida marcas de tareas que ya no existen
      const ids = new Set(datos.tareas.map((t) => t.id));
      for (const id of Object.keys(hechas)) if (!ids.has(id)) delete hechas[id];
      guardar(CLAVE_HECHAS, hechas);
      if (filtro !== "todas" && !datos.universidades.some((u) => u.nombre === filtro)) filtro = "todas";
      pintar();
    } catch (e) {
      $("#actualizado").textContent = "No se pudo cargar la lista";
      $("#contenido").innerHTML = `<div class="vacio"><b>Sin datos todavía</b>Revisa la conexión o que el programa haya corrido al menos una vez.</div>`;
    } finally {
      btn.classList.remove("girando");
    }
  }

  function pintar() {
    const ahora = new Date();
    const colores = Object.fromEntries(datos.universidades.map((u) => [u.nombre, u.color]));
    $("#actualizado").textContent = "Actualizado " + haceCuanto(datos.actualizado);

    // Filtros
    const unis = datos.universidades;
    $("#filtros").innerHTML = [`<button class="chip" data-f="todas" aria-pressed="${filtro === "todas"}">Todas</button>`]
      .concat(unis.map((u) => `<button class="chip" data-f="${esc(u.nombre)}" aria-pressed="${filtro === u.nombre}"><span class="punto" style="background:${esc(u.color)}"></span>${esc(u.nombre)}</button>`))
      .join("");

    // Avisos de universidades con problemas
    $("#avisos").innerHTML = unis.filter((u) => !u.ok).map((u) =>
      `<div class="aviso"><b>${esc(u.nombre)}:</b> no se pudo actualizar${u.ultimo_ok ? " (datos de " + haceCuanto(u.ultimo_ok) + ")" : ""}. <span style="color:var(--muted)">${esc(u.error || "")}</span></div>`
    ).join("");

    const visibles = datos.tareas.filter((t) => filtro === "todas" || t.uni === filtro);
    const pendientes = visibles.filter((t) => !hechas[t.id]);
    const nHechas = visibles.length - pendientes.length;

    // Resumen
    let nVencidas = 0, nHoy = 0, nSemana = 0;
    for (const t of pendientes) {
      const d = fechaDe(t), n = difDias(d, ahora);
      if (d < ahora) nVencidas++; else if (n <= 1) nHoy++; else if (n <= 7) nSemana++;
    }
    $("#resumen").innerHTML = `
      <div class="dato today"><b>${nHoy}</b><span>hoy y mañana</span></div>
      <div class="dato"><b>${nSemana}</b><span>en 7 días</span></div>
      <div class="dato late"><b>${nVencidas}</b><span>vencidas</span></div>`;

    // Lista agrupada
    const mostrar = verHechas ? visibles : pendientes;
    const grupos = new Map();
    for (const t of mostrar) {
      const d = fechaDe(t);
      const [clave, titulo] = hechas[t.id] && d < ahora ? ["hechas", "Hechas"] : grupoDe(d, ahora);
      if (!grupos.has(clave)) grupos.set(clave, { titulo, items: [] });
      grupos.get(clave).items.push(t);
    }
    // Las vencidas van al final: normalmente ya no se pueden entregar.
    const orden = ["hoy", "manana", "semana", "mes", "despues", "late", "hechas"];
    let html = "";
    for (const clave of orden) {
      const g = grupos.get(clave);
      if (!g) continue;
      html += `<h2 class="${clave === "late" ? "late" : ""}"><span>${g.titulo}</span><span>${g.items.length}</span></h2><div class="lista">`;
      for (const t of g.items) {
        const d = fechaDe(t);
        const c = etiquetaCuando(t, d, ahora);
        const hecha = !!hechas[t.id];
        const largo = d.toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" }) + (t.todo_el_dia ? "" : " · " + hora(d));
        html += `
        <article class="tarea ${hecha ? "hecha" : ""} ${clave === "late" && !hecha ? "late" : ""} ${abiertas.has(t.id) ? "abierta" : ""}" style="--uni:${esc(colores[t.uni] || "#888")}" data-id="${esc(t.id)}">
          <button class="check" data-check aria-label="${hecha ? "Marcar como pendiente" : "Marcar como hecha"}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </button>
          <div class="cuerpo" data-toggle>
            <div class="fila"><span class="titulo">${esc(t.titulo)}</span><span class="cuando ${hecha ? "" : c.cls}">${esc(c.txt)}</span></div>
            <div class="meta"><span class="punto"></span>${esc([t.curso, filtro === "todas" ? t.uni : "", ({Cierre: "cierra", Examen: "examen", Evento: "evento"})[t.tipo] || ""].filter(Boolean).join(" · "))}</div>
            <div class="detalle"><span class="fecha-larga">${esc(({Cierre: "Cierra el ", Examen: "Es el ", Evento: "Es el "})[t.tipo] || "Vence el ")}${esc(largo)}</span>${t.descripcion ? "\n" + esc(t.descripcion) : ""}${t.url ? `\n<a href="${esc(t.url)}" target="_blank" rel="noopener">Abrir en el aula virtual</a>` : ""}</div>
          </div>
        </article>`;
      }
      html += `</div>`;
    }
    if (!html) {
      html = `<div class="vacio"><b>${visibles.length ? "¡Todo al día!" : "No hay tareas"}</b>${visibles.length ? "No te queda nada pendiente." : "No hay fechas límite en los próximos meses."}</div>`;
    }
    $("#contenido").innerHTML = html;

    const bv = $("#verHechas");
    bv.hidden = nHechas === 0;
    bv.textContent = verHechas ? "Ocultar hechas" : `Ver hechas (${nHechas})`;
    bv.setAttribute("aria-pressed", verHechas);
  }

  $("#filtros").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]");
    if (!b) return;
    filtro = b.dataset.f; guardar(CLAVE_FILTRO, filtro); pintar();
  });
  $("#contenido").addEventListener("click", (e) => {
    const card = e.target.closest(".tarea");
    if (!card || e.target.closest("a")) return;
    const id = card.dataset.id;
    if (e.target.closest("[data-check]")) {
      if (hechas[id]) delete hechas[id]; else hechas[id] = Date.now();
      guardar(CLAVE_HECHAS, hechas); pintar();
    } else if (e.target.closest("[data-toggle]")) {
      abiertas.has(id) ? abiertas.delete(id) : abiertas.add(id);
      card.classList.toggle("abierta");
    }
  });
  $("#verHechas").addEventListener("click", () => { verHechas = !verHechas; pintar(); });
  $("#recargar").addEventListener("click", cargar);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && datos) cargar(); });
  setInterval(() => datos && pintar(), 60000); // refresca los "en X h"

  cargar();
})();
</script>
</body>
</html>
